<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>puzzl.us</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#3a9aad" />
    <script>
      // Tema e cor de destaque salvos no menu da conta, aplicados antes de desenhar
      // (ver src/ui/theme.ts e src/ui/accent.ts).
      try {
        var tema = localStorage.getItem('quebra-cabeca:tema');
        if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema;
        var destaque = localStorage.getItem('quebra-cabeca:destaque');
        if (destaque && /^[a-z]+$/.test(destaque))
          document.documentElement.dataset.accent = destaque;
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Monte quebra-cabeças com amigos em tempo real, com chamada de voz e câmera."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
